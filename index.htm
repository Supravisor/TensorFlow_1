
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TensorFlow 2.0</title>
  <link href="./styles.css" rel="stylesheet" />
</head>

<body>

  <h1>TensorFlow 2.0 console</h1>

  <form name="editor">
    <table>
      <tbody>
        <tr>
          <td id="buttons">
<div>
  <h2>Import module</h2>

  <p>
    <input type="button" class="btn btn-module" value="tensorflow" onclick="document.editor.textbox.value+='\nimport tensorflow as tf\nprint(tf.version)\n'" />
  </p>

  <hr />
  <h2>Create Tensor</h2>

  <p>
    <input class="btn" name="variable" id="variable" placeholder="variable" size="10" type="textfield" />
    <input class="btn" name="value" id="value" placeholder="values" size="10" type="textfield" />
  </p>

  <p>
    <select name="datatype">
      <option value="float64">float64</option>
      <option value="int16">int16</option>
      <option value="int32">int32</option>
      <option value="string">string</option>
    </select>
  </p>
</div>
          </td>
          <td id="textbox">
            <textarea id="preview" name="textbox"></textarea>
          </td>
          <td id="empty"></td>
        </tr>
      </tbody>
    </table>
  </form>

  <script src="./script.js"></script>
</body>
</html>
